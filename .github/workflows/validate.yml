name: validate

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 catalog/validate.py

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: sdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-25" "build-tools;34.0.0" >/dev/null
      - name: build (sdk 25 for fire os 6-8; fails on any android.* API that Android 7.1 lacks)
        run: ./launcher/build.sh
      - name: host-side launcher tests
        run: |
          jar="$ANDROID_HOME/platforms/android-25/android.jar"
          javac -d /tmp/host -cp "$jar" launcher/src/tv/dumbtv/home/FocusColor.java \
            launcher/src/tv/dumbtv/home/Config.java launcher/tests/FocusColorTest.java \
            launcher/src/tv/dumbtv/home/Live.java launcher/tests/LiveTest.java \
            launcher/src/tv/dumbtv/home/Logo.java launcher/src/tv/dumbtv/home/Item.java launcher/tests/LogoTest.java \
            launcher/src/tv/dumbtv/home/Panchang.java launcher/tests/PanchangTest.java             launcher/src/tv/dumbtv/home/Rain.java launcher/src/tv/dumbtv/home/Lang.java launcher/tests/RainTest.java             launcher/src/tv/dumbtv/home/Msn.java launcher/tests/MsnTest.java             launcher/src/tv/dumbtv/home/Festivals.java launcher/tests/FestivalsTest.java
          java -cp "/tmp/host:$jar" tv.dumbtv.home.FocusColorTest
          java -cp "/tmp/host:$jar" tv.dumbtv.home.LiveTest
          java -cp "/tmp/host:$jar" tv.dumbtv.home.LogoTest
          java -cp "/tmp/host:$jar" tv.dumbtv.home.PanchangTest
          java -cp "/tmp/host:$jar" tv.dumbtv.home.RainTest
          java -cp "/tmp/host:$jar" tv.dumbtv.home.MsnTest
          java -cp "/tmp/host:$jar" tv.dumbtv.home.FestivalsTest launcher/assets/festivals.tsv
      - name: the release apk installs on fire os 6
        run: |
          min=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging launcher/build/dumbtv-home.apk | sed -nE "s/^(minSdkVersion|sdkVersion):'([0-9]+)'.*/\2/p")
          [ "$min" = 25 ] || { echo "expected minSdkVersion 25, found $min"; exit 1; }
      - name: only INTERNET on Fire OS 7 and later
        run: |
          # Fire OS 6's Keeper trio, each capped at sdk 27, plus INTERNET for weather and live news.
          dump=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions launcher/build/dumbtv-home.apk)
          echo "$dump"
          extra=$(echo "$dump" | grep uses-permission | grep -v "maxSdkVersion='27'" | grep -v "android.permission.INTERNET" | grep -v "android.permission.WRITE_SECURE_SETTINGS" || true)
          [ -z "$extra" ] || { echo "the launcher must request only INTERNET on sdk 28+, found: $extra"; exit 1; }
          n=$(echo "$dump" | grep -c uses-permission || true)
          [ "$n" -le 5 ] || { echo "expected at most the 3 Fire OS 6 permissions, INTERNET and WRITE_SECURE_SETTINGS, found $n"; exit 1; }

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: for f in scripts/*.sh launcher/*.sh; do bash -n "$f" || exit 1; done
      - name: offline script tests (no device)
        run: python3 -m unittest discover -s tests -v
      - name: launcher version manifest
        run: ./launcher/release-check.sh --manifest
      - name: no private addresses or hardware ids
        run: |
          if grep -rnE '\b(10|172|192)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|\b([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b' \
               --exclude-dir=.git --exclude-dir=report \
               --include='*.md' --include='*.sh' --include='*.txt' --include='*.yaml' \
               --include='*.yml' --include='*.json' --include='*.py' .; then
            echo "remove the private addresses above; they belong in dumbtv.conf, not the repo"; exit 1
          fi
